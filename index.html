<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#19211c" />
  <meta name="description" content="Inventario móvil de Tante Marlene" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Tante Marlene · Inventario</title>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">TANTE MARLENE</p>
      <h1>Inventario</h1>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="Abrir herramientas">⋮</button>
  </header>

  <main>
    <section class="summary-card" aria-label="Resumen">
      <div>
        <span class="summary-label">Último conteo</span>
        <strong id="lastCount">—</strong>
      </div>
      <div class="stats">
        <div><strong id="articleCount">0</strong><span>artículos</span></div>
        <div><strong id="unitCount">0</strong><span>unidades</span></div>
        <div><strong id="reviewCount">0</strong><span>por revisar</span></div>
      </div>
    </section>

    <section class="search-wrap">
      <label class="sr-only" for="search">Buscar artículo</label>
      <input id="search" type="search" placeholder="🔎  Buscar artículo…" autocomplete="off" />
    </section>

    <nav id="categoryChips" class="chips" aria-label="Categorías"></nav>

    <section id="inventory" class="inventory" aria-live="polite"></section>
  </main>

  <div class="save-bar">
    <div id="changeHint" class="change-hint">Sin cambios pendientes</div>
    <button id="saveCountBtn" class="primary-btn">Guardar conteo</button>
  </div>

  <dialog id="toolsDialog" class="sheet-dialog">
    <form method="dialog" class="sheet-head">
      <strong>Herramientas</strong>
      <button class="icon-btn" value="cancel" aria-label="Cerrar">×</button>
    </form>
    <div class="sheet-body">
      <button id="historyBtn" class="tool-row" type="button">Historial de conteos <span>›</span></button>
      <button id="addItemBtn" class="tool-row" type="button">Añadir artículo <span>＋</span></button>
      <button id="exportBtn" class="tool-row" type="button">Exportar respaldo <span>⇩</span></button>
      <label class="tool-row file-row">Importar respaldo <span>⇧</span><input id="importInput" type="file" accept="application/json" /></label>
      <button id="installBtn" class="tool-row" type="button" hidden>Instalar app <span>⇩</span></button>
    </div>
  </dialog>

  <dialog id="itemDialog" class="sheet-dialog">
    <form id="itemForm" class="sheet-form">
      <div class="sheet-head">
        <strong id="itemDialogTitle">Editar artículo</strong>
        <button id="closeItemBtn" class="icon-btn" type="button" aria-label="Cerrar">×</button>
      </div>
      <div class="sheet-body form-grid">
        <input id="itemId" type="hidden" />
        <label>Nombre<input id="itemName" required maxlength="80" /></label>
        <label>Categoría<select id="itemCategory" required></select></label>
        <label>Subcategoría<input id="itemSubcategory" maxlength="50" /></label>
        <label>Cantidad actual<input id="itemQty" type="number" min="0" step="1" required /></label>
        <label>Stock mínimo<input id="itemMin" type="number" min="0" step="1" /></label>
        <label>Ubicación<input id="itemLocation" maxlength="80" /></label>
        <label class="wide">Observaciones<textarea id="itemNotes" rows="3" maxlength="300"></textarea></label>
        <label class="check wide"><input id="itemReview" type="checkbox" /> Marcar como “por revisar”</label>
        <button class="primary-btn wide" type="submit">Guardar artículo</button>
        <button id="deleteItemBtn" class="danger-btn wide" type="button" hidden>Eliminar artículo</button>
      </div>
    </form>
  </dialog>

  <dialog id="historyDialog" class="sheet-dialog history-dialog">
    <div class="sheet-head">
      <strong>Historial</strong>
      <button id="closeHistoryBtn" class="icon-btn" type="button" aria-label="Cerrar">×</button>
    </div>
    <div id="historyList" class="sheet-body history-list"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./data.js"></script>
  <script src="./db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
